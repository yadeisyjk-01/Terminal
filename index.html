<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yadeisy Murillo Ramirez</title>
  <meta name="description" content="Yadeisy Murillo Ramirez, Coordinadora de Costos y Presupuesto en Bioplanta S.A.S.">
  <style>
    :root {
      --bg: #f6f5f2;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #5c636b;
      --line: #e3e1dc;
      --accent: #2f5d50;
      --chip: #eef3f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181a;
        --card: #1e2124;
        --text: #e9eaeb;
        --muted: #a2a8ae;
        --line: #33373b;
        --accent: #8fc1b0;
        --chip: #24302c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 40px 32px;
    }
    .photo {
      display: block;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
      margin-bottom: 24px;
    }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-weight: 650;
      line-height: 1.2;
      letter-spacing: -.01em;
    }
    .role {
      margin-top: 8px;
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 500;
    }
    .company {
      margin-top: 2px;
      color: var(--muted);
    }
    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 28px 0;
    }
    h2 {
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    ul.skills {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    ul.skills li {
      background: var(--chip);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: .95rem;
    }
    .contact a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      word-break: break-all;
    }
    .contact a:hover { opacity: .8; }
    .contact a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (max-width: 480px) {
      main { padding: 28px 20px; }
    }
  </style>
</head>
